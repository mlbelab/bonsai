# M2 stage-limited baseline (A22): upstream backend stopped after redo starry, simulated 1k x 3.2k.
[run]
name = "upstream_redo_sim_1k"
seed = 0
backend = "upstream"
n_warm = 0
stop_after = "redo_starry"

[data]
kind = "simulate"
n_cells = 1000
n_genes = 3200  # A-3: the simulator keeps ~1.24k-1.28k genes after Bonsai's filter; 3200 raw genes targets ~2k used

[upstream]
