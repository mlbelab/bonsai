name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Get the test environment from hatch as defined in pyproject.toml.
  # This ensures that the pyproject.toml is the single point of truth for test definitions and the same tests are
  # run locally and on continuous integration.
  # Check [[tool.hatch.envs.hatch-test.matrix]] in pyproject.toml and https://hatch.pypa.io/latest/environment/ for
  # more details.
  get-environments:
    runs-on: ubuntu-slim
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - &clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Get test environments
        id: get-envs
        run: |
          ENVS_JSON=$(uvx hatch env show --json | jq -c 'to_entries
            | map(
                select(.key | startswith("hatch-test"))
                | {
                    name: .key,
                    label: (if (.key | contains("pre")) then .key + " (PRE-RELEASE DEPENDENCIES)" else .key end),
                    python: .value.python
                  }
              )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  # Run tests through hatch. Spawns a separate runner for each environment defined in the hatch matrix obtained above.
  test:
    needs: get-environments
    permissions:
       contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}

    name: ${{ matrix.env.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.env.name, 'pre') }}  # make "all-green" pass even if pre-release job fails
    env:
      UV_PYTHON: ${{ matrix.env.python }}

    steps:
      - *clone
      - *setup-uv
      - name: create hatch environment
        run: uvx hatch env create ${{ matrix.env.name }}
      - name: list all all installed package versions
        run: uvx hatch run ${{ matrix.env.name }}:uv pip list
      - name: run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "0"
        run: uvx hatch run ${{ matrix.env.name }}:run-cov -v --color=yes -n auto -m "not gpu and not x64"

  # fp64 lane: float64 runs of the dtype-generic JAX kernels (formula checks at eps64 bounds) and the
  # float32-under-x64 dtype test, in their own process (x64 is never toggled in-process).
  fp64:
    name: CPU fp64 lane (JAX_ENABLE_X64=1, -m x64)
    runs-on: ubuntu-latest
    steps:
      - *clone
      - *setup-uv
      - name: pytest (x64 lane)
        env:
          MPLBACKEND: agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: uv run --locked pytest -v --color=yes -m "x64 and not gpu"

  # Check that all tests defined above pass. This makes it easy to set a single "required" test in branch
  # protection instead of having to update it frequently. See https://github.com/re-actors/alls-green#why.
  check:
    name: Tests pass in all hatch environments
    if: always()
    needs:
      - get-environments
      - test
      - fp64
    runs-on: ubuntu-latest
    steps:
        - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
          with:
            jobs: ${{ toJSON(needs) }}
